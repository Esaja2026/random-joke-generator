<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="tag">Random Joke Generator</p>
        <h1>Need a laugh?</h1>
        <p id="joke" class="joke">Loading a joke...</p>
        <div class="buttons">
          <button id="generateBtn">Tell me a joke</button>
          <button id="copyBtn" class="secondary">Copy</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
